<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C06 · Relecture vocale</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>
  .top { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2) var(--s-4) var(--s-3); flex: none; }
  .playing { flex: 1; min-height: var(--tap-xl); border-radius: var(--r-lg); background: var(--c-ink); color: var(--c-on-dark);
    display: flex; align-items: center; gap: var(--s-3); padding: 0 var(--s-4); }
  .playing .ic { color: var(--c-accent); }
  .eq { display: flex; align-items: center; gap: 4px; height: 28px; }
  .eq i { width: 5px; border-radius: var(--r-pill); background: var(--c-accent); }
  .playing span { font-weight: 700; font-size: var(--fs-sm); margin-left: auto; color: var(--c-on-dark-muted); }
  .replay { width: var(--tap-xl); height: var(--tap-xl); border-radius: var(--r-lg); background: var(--c-surface); box-shadow: var(--sh-1); display: grid; place-items: center; flex: none; }
  .content { gap: var(--s-3); padding-top: 0; }
  .echo { padding: var(--s-5) var(--s-4); gap: var(--s-5); justify-items: stretch; }
  .dish { display: grid; grid-template-columns: 128px 1fr auto; gap: var(--s-4); align-items: center; padding: 0; border: 0; }
  .dish .photo { width: 128px; height: 100px; gap: 2px; align-content: center; border-radius: var(--r-lg); color: var(--c-accent-ink); }
  .dish .photo .ic { width: 48px; height: 48px; stroke-width: 1.6; }
  .dots { display: flex; gap: var(--s-2); align-items: center; }
  .dots i { width: 28px; height: 28px; border-radius: var(--r-pill); background: var(--c-accent); box-shadow: 0 0 0 4px var(--c-accent-soft); }
  .dish .money { opacity: .9; }
  .ph-fish { background: linear-gradient(135deg, var(--c-accent), var(--c-warm)); }
  .ph-alloco { background: linear-gradient(135deg, var(--b-coin), var(--c-accent-dark)); }
  .total { display: flex; justify-content: center; gap: var(--s-2); padding-top: var(--s-5); border-top: 2px dashed var(--c-line); }
  .total .bill { min-width: 92px; height: 50px; font-size: var(--fs-lg); border-radius: var(--r-sm); box-shadow: inset 0 0 0 3px var(--c-surface); opacity: .98; }
  .total .coin { width: 50px; height: 50px; font-size: var(--fs-sm); }
  .heard { font-size: var(--fs-xs); color: var(--c-muted); text-align: center; line-height: var(--lh-normal); padding: 0 var(--s-3); }
  .heard .ic { width: 14px; height: 14px; color: var(--c-accent); }
  .choice { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
  .big { min-height: 168px; border-radius: var(--r-xl); display: grid; place-items: center; align-content: center; gap: var(--s-2); text-decoration: none;
    color: var(--c-accent-ink); font-weight: 800; font-size: var(--fs-lg); box-shadow: var(--sh-2); }
  .big .ic { width: 64px; height: 64px; stroke-width: 3; }
  .big--no { background: var(--c-red); }
  .big--yes { background: var(--c-green); }
  .call { flex: none; padding: var(--s-3) var(--s-4) var(--s-6); }
  .call .btn { min-height: var(--tap-xl); }
</style>
</head>
<body class="screen">
  <main class="frame frame--phone" data-screen="C06">
    <div class="statusbar"><span>19:45</span><span class="icons"><i data-lucide="signal" class="ic"></i><i data-lucide="wifi" class="ic"></i><i data-lucide="battery-full" class="ic"></i></span></div>

    <div class="top">
      <div class="playing" aria-live="polite">
        <i data-lucide="volume-2" class="ic ic--lg"></i>
        <span class="eq" aria-hidden="true"><i style="height:12px"></i><i style="height:24px"></i><i style="height:16px"></i><i style="height:28px"></i><i style="height:10px"></i><i style="height:20px"></i></span>
        <span>Lecture en dioula</span>
      </div>
      <span class="replay" aria-label="Réécouter"><i data-lucide="rotate-ccw" class="ic ic--lg"></i></span>
    </div>

    <div class="content">
      <section class="card echo" aria-label="Ta commande : 1 poisson braisé, 1 alloco poulet, total 7 500 F">
        <div class="dish">
          <div class="photo ph-fish"><i data-lucide="fish" class="ic"></i><span class="photo-label">photo du plat</span></div>
          <div class="dots" aria-label="1 portion"><i></i></div>
          <span class="money"><span class="bill bill--5000">5000</span></span>
        </div>
        <div class="dish">
          <div class="photo ph-alloco"><i data-lucide="banana" class="ic"></i><span class="photo-label">photo du plat</span></div>
          <div class="dots" aria-label="1 portion"><i></i></div>
          <span class="money"><span class="bill bill--2000">2000</span><span class="coin">500</span></span>
        </div>
        <div class="total"><span class="bill bill--5000">5000</span><span class="bill bill--2000">2000</span><span class="coin">500</span></div>
      </section>

      <p class="heard"><i data-lucide="audio-lines" class="ic"></i> « Un poisson braisé, un alloco poulet. Ça fait sept mille cinq cents francs. C'est bon ? »</p>

      <div class="choice">
        <a href="C04-menu-images.html" data-link="C04" class="big big--no"><i data-lucide="x" class="ic"></i>Changer</a>
        <a href="C07-commande-en-cuisine.html" data-link="C07" class="big big--yes"><i data-lucide="check" class="ic"></i>C'est bon</a>
      </div>
    </div>

    <div class="call">
      <span class="btn btn--dark btn--block btn--lg"><i data-lucide="bell-ring" class="ic ic--lg"></i>Appeler la serveuse</span>
    </div>
  </main>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body></html>
